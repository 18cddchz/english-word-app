name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache buildozer p4a components
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.local/share/python-for-android
          key: ${{ runner.os }}-p4a-v1

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-11-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer

      - name: Build APK with Tsinghua mirror
        run: |
          export P4A_BOOTSTRAP_DOWNLOAD_HOST=https://mirrors.tuna.tsinghua.edu.cn/github-release/kivy/python-for-android
          export P4A_RELEASES=https://mirrors.tuna.tsinghua.edu.cn/github-release/kivy/python-for-android
          buildozer android debug || true
          echo "===== 列出全部文件 ====="
          ls -R
          echo "===== bin目录 ====="
          ls -la bin || echo "bin文件夹不存在或者是空"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: english-app-apk
          path: bin/*.apk
