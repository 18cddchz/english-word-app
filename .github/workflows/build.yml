name: Build Kivy APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline6-dev libssl-dev libsqlite3-dev libbz2-dev libffi-dev

      - name: Install buildozer
        run: |
          pip3 install buildozer

      - name: Build APK
        run: |
          echo y | buildozer android debug
