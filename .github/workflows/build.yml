name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies & preinstall Android SDK + accept licenses
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libpng-dev libjpeg-dev libtiff-dev libasound2-dev libzip-dev build-essential cmake
        pip3 install --upgrade buildozer
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools/latest/bin
        # 自动同意全部SDK许可
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        # 提前下载34.0.0构建工具，和spec里面保持一致
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-33"

    - name: Build APK with buildozer
      run: |
        buildozer android debug deploy run

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: myapp-apk
        path: bin/*.apk

