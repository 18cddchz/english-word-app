# ============================================================
# 小学英语点读 · GitHub Actions 云端一键打包
# 触发方式：
#   1) 手动：仓库 Actions 页 → 本工作流 → Run workflow
#   2) 自动：push main/master 分支，且改动了 main.py / buildozer.spec /
#      DroidSansFallback.ttf / 本工作流文件时触发
# 产物：bin/*.debug.apk，自动上传为构建产物（Artifacts），构建页即可下载。
# ============================================================

name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - main.py
      - buildozer.spec
      - DroidSansFallback.ttf
      - requirements-build.txt
      - .github/workflows/build-apk.yml
  workflow_dispatch:

# 本工作流只需要读取仓库代码，最小权限
permissions:
  contents: read

jobs:
  build:
    name: buildozer android debug
    runs-on: ubuntu-22.04
    # 首次打包需下载 SDK/NDK 并编译，留足时间；命中缓存后通常 20~40 分钟
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # buildozer / p4a 需要 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 官方 Ubuntu 22.04 构建依赖清单
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev automake gettext autopoint

      # 缓存 SDK/NDK/gradle 下载产物与工作目录编译中间结果，二次打包大幅提速
      - name: Cache buildozer SDK/NDK and build intermediates
        uses: actions/cache@v4
        with:
          path: |
            $HOME/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # 打包机工具链版本集中在 requirements-build.txt
      - name: Install buildozer toolchain
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-build.txt

      # 从 spec 读取版本号，用于产物命名
      - name: Read app version
        id: meta
        run: |
          version=$(grep -E '^version[[:space:]]*=' buildozer.spec | cut -d= -f2 | tr -d '[:space:]')
          echo "version=${version:-1.0.0}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: buildozer android debug --verbose

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: englishstudy-v${{ steps.meta.outputs.version }}-r${{ github.run_number }}-debug
          path: bin/*.apk
          retention-days: 30

      # 打包失败时把日志一并留存，便于在 Actions 页面排查
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs-r${{ github.run_number }}
          path: |
            .buildozer/**/*.log
            $HOME/.buildozer/**/*.log
          if-no-files-found: ignore
